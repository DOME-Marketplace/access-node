desmos:
  app:
    profile: dev
    broker:
      provider: scorpio
      externalDomain: http://scorpio.provider.svc.cluster.local:9090
      internalDomain: http://scorpio.provider.svc.cluster.local:9090
    operator:
      organizationIdentifier: did:web:provider.org
      externalDomain: http://desmos.provider.svc.cluster.local:8080
    privateKey:
      value: "0x304d170fb355df65cc17ef7934404fe9baee73a1244380076436dec6fafb1e1f"
    externalDomain:
      protocol: "http"
      domain: "desmos.provider.svc.cluster.local:8080"
    externalAccessNodesUrls:
      # Must stay empty. This list drives the *startup* P2P sync, and
      # ApplicationRunner.initializeDataSync only sets isQueueAuthorizedForEmit on
      # completion -- on error it resumes with an empty Flux and the flag stays false
      # forever, with no retry. Naming the peer here means whichever node starts first
      # syncs against one that does not exist yet and disables its own queues
      # permanently. Replication under test does not need it: it flows over the DLT
      # notification path, which is where the verifier is actually exercised.
      enableCustomUrls: true
      customUrls: ""
    dltAdapter:
      provider: digitelts
      internalDomain: http://dlt-adapter.provider.svc.cluster.local:8080
      externalDomain: http://dlt-adapter.provider.svc.cluster.local:8080
    # Both nodes must resolve the verifier by the *same* string: desmos compares this
    # against the "iss" claim of the token the stub mints.
    verifier:
      enableCustomVerifier: true
      customVerifier: "http://verifier-stub.infra.svc.cluster.local:9595"
    learCredentialMachineInBase64:
      value: "ZXlKaGJHY2lPaUpJVXpJMU5pSXNJblI1Y0NJNklrcFhWQ0o5LmV5SnpkV0lpT2lJeE1qTTBOVFkzT0Rrd0lpd2libUZ0WlNJNklrcHZhRzRnUkc5bElpd2lhV0YwSWpveE5URTJNak01TURJeWZRLlNmbEt4d1JKU01lS0tGMlFUNGZ3cE1lSmYzNlBPazZ5SlZfYWRRc3N3NWM="
    trustedAccessNodesList:
      enableCustomTrustedList: true
      customTrustedList: "http://access-node-list.infra.svc.cluster.local:8080/access-node-list/trusted_access_nodes_list.yaml"
  fullnameOverride: desmos

dlt-adapter-alastria:
  # El chart upstream expone el servicio en el puerto 80; desmos lo llama en 8080
  # (app.dltAdapter.internalDomain). Sin esto el initContainer check-external-services
  # espera para siempre a /health y el pod nunca sale de Init.
  service:
    port: 8080
  existingSecret:
    enabled: false
  env:
    PRIVATE_KEY: "0x304d170fb355df65cc17ef7934404fe9baee73a1244380076436dec6fafb1e1f"
    DOME_EVENTS_CONTRACT_ADDRESS: "0x37532A3dBF29942d10Fb8BA57dc35d2134Fe494d"
    RPC_ADDRESS: "http://blockchain-testnode.infra.svc.cluster.local:8545/"
    DOME_PRODUCTION_BLOCK_NUMBER: "0"
    ISS: "0x72b440177bcDfD339eF00ffF6B78c3620c09c469"
    DOME_EVENTS_CONTRACT_ABI: '[ { "anonymous": false, "inputs": [ { "indexed": false, "internalType": "uint256", "name": "index", "type": "uint256" }, { "indexed": false, "internalType": "uint256", "name": "timestamp", "type": "uint256" }, { "indexed": true, "internalType": "bytes32", "name": "publisherAddress", "type": "bytes32" }, { "indexed": false, "internalType": "address", "name": "authorAddress", "type": "address" }, { "indexed": true, "internalType": "bytes32", "name": "entityIDHash", "type": "bytes32" }, { "indexed": true, "internalType": "bytes32", "name": "previousEntityHash", "type": "bytes32" }, { "indexed": false, "internalType": "string", "name": "eventType", "type": "string" }, { "indexed": false, "internalType": "string", "name": "dataLocation", "type": "string" }, { "indexed": false, "internalType": "string[]", "name": "metadata", "type": "string[]" } ], "name": "EventDOMEv1", "type": "event" }, { "anonymous": false, "inputs": [ { "indexed": true, "internalType": "address", "name": "previousOwner", "type": "address" }, { "indexed": true, "internalType": "address", "name": "newOwner", "type": "address" } ], "name": "OwnershipTransferred", "type": "event" }, { "inputs": [ { "internalType": "bytes32", "name": "_publisherAddress", "type": "bytes32" }, { "internalType": "address", "name": "_authorAdress", "type": "address" }, { "internalType": "bytes32", "name": "_entityIDHash", "type": "bytes32" }, { "internalType": "bytes32", "name": "_previousEntityHash", "type": "bytes32" }, { "internalType": "string", "name": "_eventType", "type": "string" }, { "internalType": "string", "name": "_dataLocation", "type": "string" }, { "internalType": "string[]", "name": "_metadata", "type": "string[]" } ], "name": "emitNewEvent", "outputs": [ { "internalType": "bool", "name": "", "type": "bool" } ], "stateMutability": "nonpayable", "type": "function" }, { "inputs": [], "name": "index", "outputs": [ { "internalType": "uint256", "name": "", "type": "uint256" } ], "stateMutability": "view", "type": "function" }, { "inputs": [], "name": "owner", "outputs": [ { "internalType": "address", "name": "", "type": "address" } ], "stateMutability": "view", "type": "function" }, { "inputs": [], "name": "renounceOwnership", "outputs": [], "stateMutability": "nonpayable", "type": "function" }, { "inputs": [ { "internalType": "address", "name": "newOwner", "type": "address" } ], "name": "transferOwnership", "outputs": [], "stateMutability": "nonpayable", "type": "function" } ]'
  replicaCount: 1
  logLevel:
    root: DEBUG
    app: DEBUG
  fullnameOverride: dlt-adapter

# The umbrella chart declares a second, hashnet-flavoured dlt-adapter under the same
# condition. It is unused here; scale it to zero rather than run a pod for nothing.
dlt-adapter-hashnet:
  replicaCount: 0
  fullnameOverride: dlt-adapter-hashnet

# Helm habilita una dependencia cuando la ruta de su `condition` NO existe, asi que sin
# esta clave dome-ied se despliega solo, y sin namespace propio cae en `default`, donde
# k3s-maven-plugin lo espera y agota el timeout. El IT no lo necesita.
dome-ied:
  enabled: false

postgresql:
  primary:
    persistence:
      enabled: false
  readReplicas:
    persistence:
      enabled: false

postgis:
  primary:
    persistence:
      enabled: false
  readReplicas:
    persistence:
      enabled: false

tm-forum-api:
  defaultConfig:
    endpointsPort: 8080
    additionalEnvVars:
      - name: LOGBACK_APPENDER
        value: CONSOLE
      - name: API_EXTENSION_ENABLED
        value: "true"


  apiProxy:
    service:
      type: LoadBalancer
      port: 8080
