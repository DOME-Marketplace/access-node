apiVersion: v1
kind: ConfigMap
metadata:
  name: access-node-list
  namespace: {{ $.Release.Namespace | quote }}
data:
  # dlt_address is parsed by desmos with new BigInteger(s) -- base 10. A "0x..." literal here
  # throws NumberFormatException at startup and the node never authorizes its queues, so these
  # are the decimal forms of the dlt-adapter ISS values in it/{provider,consumer}/values.yaml:
  #   provider 0x72b440177bcDfD339eF00ffF6B78c3620c09c469
  #   consumer 0xE377C763792bA6E3ec384c9572F3f03F9FEc2D70
  trusted_access_nodes_list.yaml: |-
    organizations:
      - name: provider
        publicKey: 0x0456dfacbf8a69f873132251ddadcc7dea98ecee43f7e9f41fec37e7e9bf1c4accdb47da9f127f8b09c16d758956a86ea1fb146bc1ce05322e47fc1221c32c195a
        url: http://desmos.provider.svc.cluster.local:8080
        dlt_address: "654844665187011889642424028371987284456142128233"
      - name: consumer
        publicKey: 0x0487d09309a2a6212c1b5d4cf97d6f4515a003fdc26e05f8c8fa176fbdead54c3210874c71b6f1f2a0df7c091cd49fd5fd72a3162200fb7b09b5f4085a6ad1dd3b
        url: http://desmos.consumer.svc.cluster.local:8080
        dlt_address: "1298612062849554702809542410709793002038143757680"
