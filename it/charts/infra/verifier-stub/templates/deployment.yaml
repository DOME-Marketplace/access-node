kind: Deployment
apiVersion: apps/v1
metadata:
  name: verifier-stub
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "verifier-stub.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: verifier-stub
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: verifier-stub
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: default

      containers:
        - name: verifier-stub
          imagePullPolicy: IfNotPresent
          image: "nginx:1.27-alpine"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /.well-known/openid-configuration
              port: {{ .Values.service.port }}
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 10
          volumeMounts:
            - name: verifier-stub
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: verifier-stub
          configMap:
            name: verifier-stub
            items:
              - key: nginx.conf
                path: default.conf
