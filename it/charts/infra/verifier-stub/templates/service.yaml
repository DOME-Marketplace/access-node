apiVersion: v1
kind: Service
metadata:
  name: verifier-stub
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "verifier-stub.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: verifier-stub
    app.kubernetes.io/instance: {{ .Release.Name }}
