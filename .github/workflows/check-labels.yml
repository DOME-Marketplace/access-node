name: Check PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    branches:
      - main

jobs:
  check-changes:
    uses: ./.github/workflows/chart-changed.yaml

  check:
    needs: "check-changes"
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.changed == 'true'


    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '11'
          java-package: jdk
          distribution: temurin

      - id: bump
        uses: zwaldowski/match-label-action@741aab5a93a215d559b62e24b860b46f049a0920  # v6
        with:
          allowed: major,minor,patch
  
  comment:
    needs: "check"
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: technote-space/workflow-conclusion-action@45ce8e0eb155657ab8ccf346ade734257fd196a5  # v3
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Comment PR
        if:  ${{ contains(needs.check.result, 'failure') }}
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b  # v3.0.1
        with:
          message: "Please apply one of the following labels to the PR: 'patch', 'minor', 'major'."
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}