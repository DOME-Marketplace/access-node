name: Test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

jobs:
  it:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-java@v1
        with:
          java-version: '17'
          java-package: jdk

      - uses: azure/setup-helm@v3

      - uses: azure/setup-helm@v3

      - name: Execute tests
        id: test
        run: |
          cd it
          mvn clean test integration-test verify

      # the k3s plugin only reports which resource it gave up on, not why. dump the cluster
      # so a timeout can be told apart from a pod that never came up.
      - name: Dump cluster state
        if: failure()
        run: |
          kubectl() { docker exec k3s-maven-plugin kubectl "$@" || true; }
          kubectl get pods --all-namespaces -o wide
          kubectl get jobs --all-namespaces
          kubectl describe job dome-contract --namespace=infra
          # --all-containers skips init containers, so name it: when this job hangs it is
          # the init container that is still going, and its log is the whole story.
          kubectl logs job/dome-contract --namespace=infra -c init-account --tail=100
          kubectl logs job/dome-contract --namespace=infra -c contract-create --tail=100
          # tell a broken pod network apart from a slow one: both look like a hung job.
          kubectl get node k3s -o jsonpath='{.spec.podCIDR}{"\n"}'
          kubectl logs --namespace=kube-system -l k8s-app=kube-dns --tail=30
          kubectl get services --all-namespaces
          # Reaching the node by name exercises CNI, kube-proxy and CoreDNS at once, so when it
          # fails the layer is ambiguous. Hit the pod IP, the service IP and the name in turn:
          # whichever is the first to fail is the layer that is broken.
          POD_IP=$(docker exec k3s-maven-plugin kubectl get endpoints blockchain-testnode -n infra -o jsonpath='{.subsets[0].addresses[0].ip}' 2>/dev/null || true)
          SVC_IP=$(docker exec k3s-maven-plugin kubectl get service blockchain-testnode -n infra -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true)
          DNS_IP=$(docker exec k3s-maven-plugin kubectl get pod -n kube-system -l k8s-app=kube-dns -o jsonpath='{.items[0].status.podIP}' 2>/dev/null || true)
          echo "probing pod=$POD_IP service=$SVC_IP coredns-pod=$DNS_IP"
          kubectl run netcheck --namespace=infra --rm --attach --restart=Never --quiet \
            --image=badouralix/curl-jq:ubuntu --command -- /bin/bash -c \
            'rpc() { curl -s -m 5 -X POST --data "{\"jsonrpc\":\"2.0\",\"method\":\"eth_accounts\",\"params\":[],\"id\":1}" -H "Content-Type: application/json" "$1"; echo " <- $2"; };
             cat /etc/resolv.conf;
             rpc "http://'"$POD_IP"':8545/" "pod ip (cni)";
             rpc "http://'"$SVC_IP"':8545/" "service ip (kube-proxy)";
             getent hosts blockchain-testnode.infra.svc.cluster.local || echo "name did not resolve (coredns)";
             rpc "http://blockchain-testnode.infra.svc.cluster.local:8545/" "service name"'
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -n 50
