name: Pre-Release

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

jobs:

    it:
      uses: ./.github/workflows/it.yaml
      # A reusable workflow cannot grant itself more than the caller has, so the scopes its
      # reporting step needs have to be handed down from here.
      permissions:
        contents: read
        checks: write
        pull-requests: write

    check-changes:
      # Gates publishing on the suite passing: deploy depends on this rather
      # than on it directly, so dropping this would let a release go out with
      # the tests still running.
      needs: ["it"]
      uses: ./.github/workflows/chart-changed.yaml

    generate-version:
      needs: ["check-changes" ]
      if: needs.check-changes.outputs.changed == 'true'
      runs-on: ubuntu-latest

      outputs:
        version: ${{ steps.out.outputs.version }}

      steps:
        - uses: actions/checkout@v7.0.1

        - id: bump
          uses: zwaldowski/match-label-action@741aab5a93a215d559b62e24b860b46f049a0920  # v6
          with:
            allowed: major,minor,patch

        - uses: zwaldowski/semver-release-action@a6a8309186ccf60c52ea2463a723c78d3b924577  # v4
          with:
            dry_run: true
            bump: ${{ steps.bump.outputs.match }}
            github_token: ${{ secrets.GITHUB_TOKEN }}

        - name: Get PR Number
          id: pr_number
          run: echo "::set-output name=nr::$(echo $GITHUB_REF | awk 'BEGIN { FS = "/" } ; { print $3 }')"
          
        - name: Set version output
          id: out
          run: echo "::set-output name=version::$(echo ${VERSION}-PRE-${{ steps.pr_number.outputs.nr }})"

    deploy:

      needs: ["check-changes", "generate-version" ]
      runs-on: ubuntu-latest
      if: needs.check-changes.outputs.changed == 'true'

      steps:

        # On a pull_request event checkout lands on the merge ref, not the branch tip, so
        # pushing HEAD back would carry a merge of main onto the PR branch. Ask for the
        # branch itself; fetch-depth 0 replaces the manual unshallow, which errors on a
        # complete clone anyway.
        - uses: actions/checkout@v7.0.1
          with:
            ref: ${{ github.head_ref }}
            fetch-depth: 0

        - name: Configure Git
          run: |
            git config user.name "$GITHUB_ACTOR"
            git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

        - name: Install Helm
          run: |
            curl -fsSLo get_helm.sh https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3
            chmod 700 get_helm.sh
            ./get_helm.sh

        # prepare yaml parser
        # setup-go dropped its implicit version default; without one it falls back to
        # whatever the runner happens to ship.
        - uses: actions/setup-go@v7.0.0
          with:
            go-version: stable
        - name: Install yq
          run: |
            go install github.com/mikefarah/yq/v4@latest
            yq --version

        - name: Set the version
          run: |
              yq e -i '.version = "${{ needs.generate-version.outputs.version }}"' ./charts/access-node/Chart.yaml

        - name: generate docs
          run:
            docker run --rm --volume "$(pwd):/helm-docs" -u $(id -u) jnorwood/helm-docs:latest

        - name: Commit files
          continue-on-error: true
          run: |
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git status

            # No [skip ci] here, however tempting. Squashing a pull request folds every
            # commit message into one, so the marker travelled into main and GitHub skipped
            # the whole Release run -- 1.3.19 went unpublished after #135 with no failure to
            # notice. A marker that silences the release is worse than the runs it silenced.
            git commit -m "Update helm documentation" -a

            echo status update
            git status

        - name: Push changes
          continue-on-error: true
          uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c  # v1.3.0
          with:
            branch: ${{ github.head_ref }}

        - name: Run chart-releaser
          id: cr
          uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f  # v1.7.0
          env:
            CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
            CR_SKIP_EXISTING: true
          with:
            skip_upload: true


        # cr index builds the index from .cr-release-packages, which the step above only
        # fills when it actually packages a chart. With nothing released there is nothing to
        # index, and the action skips installing cr altogether, so this would fail on the
        # missing binary and then again on an empty commit.
        - name: Create index.yaml
          if: steps.cr.outputs.changed_charts != ''
          run: |
            owner=$(cut -d '/' -f 1 <<< "$GITHUB_REPOSITORY")
            repo=$(cut -d '/' -f 2 <<< "$GITHUB_REPOSITORY")

            git switch gh-pages
            
            cr index -o "$owner" -r "$repo"

            mv .cr-index/index.yaml pre/index.yaml

            git add pre/index.yaml
            git commit -m "add pre-index"
            git push --set-upstream origin gh-pages

        # The suite proves the chart in the repository works; nothing proves that what we
        # publish can actually be installed. Pull it back the way a consumer would -- through
        # the Helm repository index, not the release URL -- so a broken or stale index is
        # caught here rather than by whoever tries to install it.
        #
        # Runs after the index has been updated, and keeps retrying because that is not the
        # same as the index being served: pushing to gh-pages starts a Pages build, and until
        # it finishes the old index is still what answers. Retrying through that window is
        # what separates a genuinely broken chart from one that is merely not published yet.
        # helm repo update goes inside the loop so each attempt refetches rather than reusing
        # the first, stale, index.
        - name: Verify the published chart
          if: steps.cr.outputs.changed_charts != ''
          run: |
            version="${{ needs.generate-version.outputs.version }}"
            helm repo add access-node-pre https://dome-marketplace.github.io/access-node/pre/

            for attempt in $(seq 1 15); do
              helm repo update access-node-pre > /dev/null
              if helm pull access-node-pre/access-node --version "$version"; then
                break
              fi
              echo "chart $version not served yet (attempt $attempt), retrying"
              sleep 20
            done

            if [ ! -f "access-node-$version.tgz" ]; then
              echo "chart $version never became installable from https://dome-marketplace.github.io/access-node/pre/"
              exit 1
            fi

            # Renders rather than lints: the package vendors its dependencies, so this
            # executes every template instead of only checking their shape.
            helm template verify "access-node-$version.tgz" > /dev/null
            echo "published chart $version installs and renders"


        