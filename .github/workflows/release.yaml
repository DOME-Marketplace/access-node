name: Release

on:
  push:
    branches:
      - main

jobs:
    it:
      uses: ./.github/workflows/it.yaml
      # A reusable workflow cannot grant itself more than the caller has, so the scopes its
      # reporting step needs have to be handed down from here.
      permissions:
        contents: read
        checks: write
        pull-requests: write

    check-changes: 

      needs: ["it"]
      runs-on: ubuntu-latest

      outputs:
        changed: ${{ steps.changes.outputs.changed }}

      steps:

        - uses: actions/checkout@v7.0.1
          with:
            fetch-depth: 0

        - name: Get changed files
          id: changed-files
          uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6

        - name: Check changes
          id: changes
          shell: bash
          run: |

            for file in ${{ steps.changed-files.outputs.all_changed_and_modified_files }}; do         

              echo "$file was changed"
              baseFolder=$(cut -d'/' -f1 <<< "$file")
              chartName=$(cut -d'/' -f2 <<< "$file")
              if [ $baseFolder = "charts" ] && [ $chartName = "access-node" ]; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                break;
              fi  
            done  

    generate-version:
    
      needs: [ "it", "check-changes" ]
      if: ${{ needs.check-changes.outputs.changed }}
      runs-on: ubuntu-latest

      outputs:
        version: ${{ steps.out.outputs.version }}

      steps:
        - uses: actions/checkout@v7.0.1

        - id: pr
          uses: actions-ecosystem/action-get-merged-pull-request@59afe90821bb0b555082ce8ff1e36b03f91553d9  # v1.0.1
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}

        - uses: zwaldowski/semver-release-action@a6a8309186ccf60c52ea2463a723c78d3b924577  # v4
          with:
            dry_run: true
            bump: ${{ steps.pr.outputs.labels }}
            github_token: ${{ secrets.GITHUB_TOKEN }}

        - name: Set version output
          id: out
          run: echo "::set-output name=version::$(echo ${VERSION})"

    deploy:

      needs: [ "it", "check-changes", "generate-version" ]
      if: ${{ needs.check-changes.outputs.changed }}
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v7.0.1

        - name: Fetch history
          run: git fetch --prune --unshallow

        - name: Configure Git
          run: |
            git config user.name "$GITHUB_ACTOR"
            git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

        # See https://github.com/helm/chart-releaser-action/issues/6
        - name: Install Helm
          run: |
            curl -fsSLo get_helm.sh https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3
            chmod 700 get_helm.sh
            ./get_helm.sh

        # prepare yaml parser
        # setup-go dropped its implicit version default; without one it falls back to
        # whatever the runner happens to ship.
        - uses: actions/setup-go@v7.0.0
          with:
            go-version: stable
        - name: Install yq
          run: |
            go install github.com/mikefarah/yq/v4@latest
            yq --version

        - name: Set the version
          run: |
              yq e -i '.version = "${{ needs.generate-version.outputs.version }}"' ./charts/access-node/Chart.yaml

        - name: Run chart-releaser
          id: cr
          uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f  # v1.7.0
          env:
            CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
            CR_SKIP_EXISTING: true
          with:
            pages_branch: gh-pages


        # The suite proves the chart in the repository works; nothing proves that what we
        # publish can actually be installed. Pull it back the way a consumer would -- through
        # the Helm repository index, not the release URL -- so a broken or stale index is
        # caught here rather than by whoever tries to install it. Retries because GitHub Pages
        # takes a while to serve a fresh commit.
        - name: Verify the published chart
          if: steps.cr.outputs.changed_charts != ''
          run: |
            version="${{ needs.generate-version.outputs.version }}"
            helm repo add access-node https://dome-marketplace.github.io/access-node/

            for attempt in $(seq 1 10); do
              helm repo update access-node > /dev/null
              if helm pull access-node/access-node --version "$version"; then
                break
              fi
              echo "chart $version not served yet (attempt $attempt), retrying"
              sleep 20
            done

            if [ ! -f "access-node-$version.tgz" ]; then
              echo "chart $version never became installable from https://dome-marketplace.github.io/access-node/"
              exit 1
            fi

            # Renders rather than lints: the package vendors its dependencies, so this
            # executes every template instead of only checking their shape.
            helm template verify "access-node-$version.tgz" > /dev/null
            echo "published chart $version installs and renders"

        - uses: marvinpinto/action-automatic-releases@d68defdd11f9dcc7f52f35c1b7c236ee7513bcc1  # latest
          with:
            repo_token: "${{ secrets.GITHUB_TOKEN }}"
            automatic_release_tag: ${{ needs.generate-version.outputs.version }}
            prerelease: false
            title: ${{ needs.generate-version.outputs.version }}
            files: |
              LICENSE