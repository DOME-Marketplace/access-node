version: 2

updates:

  # The workflows pin third-party actions by commit, which stops a rewritten tag reaching us
  # but also freezes them: without something bumping the pins they rot in place. Dependabot
  # reads the "# <tag>" beside each SHA and moves both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait before adopting a freshly published release, so a compromised one has time to be
    # found first. tj-actions/changed-files had its tags rewritten to leak secrets and sat
    # here unnoticed; pinning keeps that out, this keeps us from pinning straight to it.
    # Only default-days applies: the github-actions ecosystem ignores the semver keys.
    cooldown:
      default-days: 7
    groups:
      # One pull request for the routine bumps. It matters more here than usual: every pull
      # request builds a k3s cluster and runs the whole integration suite, several minutes
      # each. Majors stay out of the group so they arrive alone and get looked at.
      actions:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: maven
    directory: /it
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    # The generated OpenAPI client is built against whatever okhttp version
    # openapi-generator emits, so these are not ours to pick. Proposed on their own they
    # either fail to compile -- okhttp 5 moved okhttp3.Call -- or, worse, pass CI while
    # leaving the two halves of the same library on different majors. They move when the
    # generator moves.
    ignore:
      - dependency-name: com.squareup.okhttp3:okhttp
      - dependency-name: com.squareup.okhttp3:logging-interceptor
    groups:
      # These three have to move together. maven-failsafe-plugin carries its own provider,
      # surefire-junit-platform, which pins the JUnit Platform version it needs for itself;
      # if junit-bom does not cover that version, two Platform versions end up in the same
      # run and test discovery fails with "Tests run: 0" and no compile error pointing at it.
      # That is exactly what broke #120. Majors are allowed here on purpose: split apart they
      # produce a pull request that compiles but cannot find its own tests, which is harder
      # to spot than a build failure.
      test-harness:
        patterns:
          - org.apache.maven.plugins:maven-surefire-plugin
          - org.apache.maven.plugins:maven-failsafe-plugin
          - org.junit:junit-bom
        update-types:
          - major
          - minor
          - patch
      maven:
        exclude-patterns:
          - org.apache.maven.plugins:maven-surefire-plugin
          - org.apache.maven.plugins:maven-failsafe-plugin
          - org.junit:junit-bom
        update-types:
          - minor
          - patch
    commit-message:
      prefix: build
      include: scope
